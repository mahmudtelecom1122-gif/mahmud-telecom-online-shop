<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>পণ্য | Mahmud Telecom</title><link rel="stylesheet" href="css/shop-admin.css"></head><body><main class="admin-wrap"><script src="js/shop-final.js"></script><script>document.write(adminShell("admin-products.html"))</script><div class="card"><h1>পণ্য ব্যবস্থাপনা</h1><p class="muted">আসল পণ্যের ছবি, নাম, দাম, ক্যাটাগরি ও স্টক দিন।</p><form id="form"><input id="editId" type="hidden"><div class="row"><div><label>পণ্যের নাম</label><input id="name" required></div><div><label>ক্যাটাগরি</label><input id="category" required placeholder="যেমন: মোবাইল, চার্জার"></div><div><label>বিক্রয় মূল্য</label><input id="price" type="number" min="0" required></div><div><label>পুরনো মূল্য (ঐচ্ছিক)</label><input id="oldPrice" type="number" min="0"></div><div><label>স্টক</label><input id="stock" type="number" min="0" required></div><div><label>পণ্যের ছবি</label><input id="image" type="file" accept="image/*"><img id="preview" class="preview"></div></div><label><input id="active" type="checkbox" checked style="width:auto"> অনলাইনে দেখাবেন</label><div class="actions"><button class="btn">সংরক্ষণ</button><button type="button" class="btn gray" id="reset">নতুন পণ্য</button></div></form></div>
<div class="card"><table><thead><tr><th>ছবি</th><th>পণ্য</th><th>ক্যাটাগরি</th><th>মূল্য</th><th>স্টক</th><th>অবস্থা</th><th>কাজ</th></tr></thead><tbody id="list"></tbody></table></div></main><script>let d=MT.get(),imageData="";
function render(){list.innerHTML=d.products.map(x=>`<tr><td>${x.image?`<img class="product-img" src="${x.image}">`:"📦"}</td><td>${MT.escape(x.name)}</td><td>${MT.escape(x.category)}</td><td>${MT.money(x.price)}</td><td>${x.stock}</td><td>${x.active?'<span class="status">Online</span>':'<span class="status red">Hidden</span>'}</td><td><button class="btn" onclick="editProduct(${x.id})">Edit</button> <button class="btn danger" onclick="deleteProduct(${x.id})">Delete</button></td></tr>`).join("")}
image.onchange=()=>{const f=image.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{imageData=r.result;preview.src=imageData};r.readAsDataURL(f)};
form.onsubmit=e=>{e.preventDefault();const id=Number(editId.value);const old=d.products.find(x=>x.id===id);const obj={id:id||MT.next(d.products),name:name.value.trim(),category:category.value.trim(),price:Number(price.value),oldPrice:Number(oldPrice.value||0),stock:Number(stock.value),image:imageData||(old?.image||""),active:active.checked};if(id)d.products=d.products.map(x=>x.id===id?obj:x);else d.products.push(obj);MT.save(d);alert("পণ্য সংরক্ষণ হয়েছে");clearForm();render()};
function clearForm(){form.reset();editId.value="";imageData="";preview.removeAttribute("src");active.checked=true}
reset.onclick=clearForm;
window.editProduct=id=>{const x=d.products.find(a=>a.id===id);editId.value=x.id;name.value=x.name;category.value=x.category;price.value=x.price;oldPrice.value=x.oldPrice||"";stock.value=x.stock;active.checked=x.active;imageData=x.image||"";preview.src=x.image||""};
window.deleteProduct=id=>{if(confirm("এই পণ্যটি মুছে ফেলবেন?")){d.products=d.products.filter(x=>x.id!==id);MT.save(d);render()}};
render();</script></body></html>

<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>অর্ডার | Mahmud Telecom</title><link rel="stylesheet" href="css/shop-admin.css"></head><body><main class="admin-wrap"><script src="js/api-config.js"></script><script src="js/shop-final.js"></script><script>document.write(MT.adminShell("admin-orders.html"))</script><div class="card"><h1>অনলাইন অর্ডার</h1><div class="actions"><button class="btn gray" onclick="print()">🖨️ Print / PDF</button><button class="btn" onclick="load()">Refresh</button></div></div><div class="card"><table><thead><tr><th>অর্ডার</th><th>কাস্টমার</th><th>পণ্য</th><th>মোট</th><th>ডেলিভারি</th><th>স্ট্যাটাস</th><th>কাজ</th></tr></thead><tbody id="list"></tbody></table></div></main><script>
let d=[];
function render(){list.innerHTML=d.map(x=>`<tr><td><b>${MT.escape(x.orderNo)}</b><br><small>${MT.escape(x.createdAt||x.date||"")}</small></td><td>${MT.escape(x.customerName||x.customer?.name||"")}<br>${MT.escape(x.phone||x.customer?.phone||"")}<br><small>${MT.escape(x.address||x.customer?.address||"")}, ${MT.escape(x.area||x.customer?.area||"")}</small></td><td>${(x.items||[]).map(i=>MT.escape(i.productName||i.name||"")+" × "+(i.quantity??i.qty)).join("<br>")}</td><td>${MT.money(x.grandTotal||x.total)}</td><td>${MT.money(x.deliveryCharge)}</td><td><select onchange="changeStatus('${x.id}',this.value)">${["New","Confirmed","Processing","Shipped","Delivered","Cancelled"].map(s=>`<option ${x.status===s?"selected":""}>${s}</option>`).join("")}</select></td><td><button class="btn danger" onclick="removeOrder('${x.id}')">Delete</button></td></tr>`).join("")||'<tr><td colspan="7">এখনো কোনো অর্ডার নেই।</td></tr>'}
async function load(){try{d=await MT.getOrders();render()}catch(e){alert("অর্ডার লোড হয়নি: "+e.message)}}
window.changeStatus=async(id,status)=>{try{await MT.updateOrderStatus(id,status);await load()}catch(e){alert("স্ট্যাটাস বদলানো যায়নি: "+e.message)}};
window.removeOrder=async id=>{if(confirm("অর্ডারটি মুছে ফেলবেন?")){try{await MT.deleteOrder(id);await load()}catch(e){alert("Delete হয়নি: "+e.message)}}};
(async()=>{if(await MT.requireAdminKey())load();else location.href="admin-login.html"})();
</script></body></html>

<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>অর্ডার | Mahmud Telecom</title><link rel="stylesheet" href="css/shop-admin.css"></head><body><main class="admin-wrap"><script src="js/shop-final.js"></script><script>document.write(adminShell("admin-orders.html"))</script><div class="card"><h1>অনলাইন অর্ডার</h1><div class="actions"><button class="btn gray" onclick="print()">🖨️ Print / PDF</button><button class="btn" onclick="render()">Refresh</button></div></div><div class="card"><table><thead><tr><th>অর্ডার</th><th>কাস্টমার</th><th>পণ্য</th><th>মোট</th><th>ডেলিভারি</th><th>স্ট্যাটাস</th><th>কাজ</th></tr></thead><tbody id="list"></tbody></table></div></main><script>const d=MT.get();function render(){list.innerHTML=d.orders.slice().reverse().map(x=>`<tr><td><b>${x.orderNo}</b><br><small>${x.date}</small></td><td>${MT.escape(x.customer.name)}<br>${MT.escape(x.customer.phone)}<br><small>${MT.escape(x.customer.address)}, ${MT.escape(x.customer.area)}</small></td><td>${x.items.map(i=>MT.escape(i.name)+" × "+i.qty).join("<br>")}</td><td>${MT.money(x.total)}</td><td>${MT.money(x.deliveryCharge)}</td><td><select onchange="changeStatus('${x.orderNo}',this.value)"><option ${x.status=="New"?"selected":""}>New</option><option ${x.status=="Confirmed"?"selected":""}>Confirmed</option><option ${x.status=="Processing"?"selected":""}>Processing</option><option ${x.status=="Shipped"?"selected":""}>Shipped</option><option ${x.status=="Delivered"?"selected":""}>Delivered</option><option ${x.status=="Cancelled"?"selected":""}>Cancelled</option></select></td><td><button class="btn danger" onclick="deleteOrder('${x.orderNo}')">Delete</button></td></tr>`).join("")||'<tr><td colspan="7">এখনো কোনো অর্ডার নেই।</td></tr>'}
window.changeStatus=(no,status)=>{const x=d.orders.find(a=>a.orderNo===no);if(x){x.status=status;MT.save(d);render()}};
window.deleteOrder=no=>{if(confirm("অর্ডার মুছে ফেলবেন?")){d.orders=d.orders.filter(x=>x.orderNo!==no);MT.save(d);render()}};
render();</script></body></html>

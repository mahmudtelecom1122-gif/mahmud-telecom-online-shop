<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ড্যাশবোর্ড | Mahmud Telecom</title><link rel="stylesheet" href="css/shop-admin.css"></head><body><main class="admin-wrap"><script src="js/shop-final.js"></script><script>document.write(adminShell("admin.html"))</script><div class="card"><h1>অনলাইন শপ ড্যাশবোর্ড</h1><p class="muted">এখান থেকে আপনার অনলাইন দোকানের পণ্য ও ডেলিভারি অর্ডার পরিচালনা করুন।</p></div>

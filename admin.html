<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ড্যাশবোর্ড | Mahmud Telecom</title><link rel="stylesheet" href="css/shop-admin.css"></head><body><main class="admin-wrap"><script src="js/api-config.js"></script><script src="js/shop-final.js"></script><script>document.write(MT.adminShell("admin.html"))</script><div class="card"><h1>অনলাইন শপ ড্যাশবোর্ড</h1><p class="muted">পণ্য, স্টক ও অনলাইন ডেলিভারি অর্ডার পরিচালনা করুন।</p><div id="mode" class="muted"></div></div><div class="grid"><div class="card"><div class="muted">সক্রিয় পণ্য</div><div id="products" class="stat">…</div></div><div class="card"><div class="muted">নতুন অর্ডার</div><div id="newOrders" class="stat">…</div></div><div class="card"><div class="muted">মোট অর্ডার</div><div id="orders" class="stat">…</div></div><div class="card"><div class="muted">কম স্টক</div><div id="low" class="stat">…</div></div></div><div class="card"><div class="actions"><a class="btn" href="admin-products.html">+ নতুন পণ্য</a><a class="btn success" href="admin-orders.html">📦 অর্ডার দেখুন</a><a class="btn gray" href="index.html">🛍️ Shop খুলুন</a></div></div></main><script>(async()=>{if(!(await MT.requireAdminKey())){location.href="admin-login.html";return}try{const [ps,os]=await Promise.all([MT.getProducts(true),MT.getOrders()]);products.textContent=ps.filter(x=>x.active).length;orders.textContent=os.length;newOrders.textContent=os.filter(x=>["New","Confirmed","Processing"].includes(x.status)).length;low.textContent=ps.filter(x=>x.active&&Number(x.stock)<=3).length;mode.textContent=(await MT.detectApi())?"● Database/API mode":"● Browser local mode"}catch(e){alert("ডাটা লোড হয়নি: "+e.message)}})();</script></body></html>

<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>সেটিংস | Mahmud Telecom</title><link rel="stylesheet" href="css/shop-admin.css"></head><body><main class="admin-wrap"><script src="js/api-config.js"></script><script src="js/shop-final.js"></script><script>document.write(MT.adminShell("admin-settings.html"))</script><div class="card"><h1>শপ সেটিংস</h1><form id="form"><div class="row"><div><label>দোকানের নাম</label><input id="shopName"></div><div><label>ফোন</label><input id="phone"></div><div><label>WhatsApp নম্বর (880...)</label><input id="whatsapp"></div><div><label>শহরের ভিতর Delivery Charge</label><input id="inside" type="number" min="0"></div><div><label>শহরের বাইরে Delivery Charge</label><input id="outside" type="number" min="0"></div></div><label><input id="cod" type="checkbox" style="width:auto"> Cash on Delivery চালু</label><br><button class="btn">সংরক্ষণ</button></form></div></main><script>
(async()=>{if(!(await MT.requireAdminKey())){location.href="admin-login.html";return}try{const d=await MT.getSettings();shopName.value=d.shopName||"";phone.value=d.phone||"";whatsapp.value=d.whatsapp||"";inside.value=d.deliveryInside??60;outside.value=d.deliveryOutside??120;cod.checked=!!d.cod}catch(e){alert("সেটিংস লোড হয়নি: "+e.message)}})();
form.onsubmit=async e=>{e.preventDefault();try{await MT.saveSettings({shopName:shopName.value.trim(),phone:phone.value.trim(),whatsapp:whatsapp.value.trim(),deliveryInside:Number(inside.value),deliveryOutside:Number(outside.value),cod:cod.checked});alert("সেটিংস সংরক্ষণ হয়েছে")}catch(err){alert("সেটিংস সংরক্ষণ হয়নি: "+err.message)}};
</script></body></html>

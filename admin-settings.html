<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>সেটিংস | Mahmud Telecom</title><link rel="stylesheet" href="css/shop-admin.css"></head><body><main class="admin-wrap"><script src="js/shop-final.js"></script><script>document.write(adminShell("admin-settings.html"))</script><div class="card"><h1>শপ সেটিংস</h1><form id="form"><div class="row"><div><label>দোকানের নাম</label><input id="shopName"></div><div><label>ফোন</label><input id="phone"></div><div><label>WhatsApp নম্বর (880...)</label><input id="whatsapp"></div><div><label>চট্টগ্রাম/শহরের ভিতর Delivery Charge</label><input id="inside" type="number"></div><div><label>শহরের বাইরে Delivery Charge</label><input id="outside" type="number"></div></div><label><input id="cod" type="checkbox" style="width:auto"> Cash on Delivery চালু</label><br><button class="btn">সংরক্ষণ</button></form></div></main><script>const d=MT.get();shopName.value=d.settings.shopName;phone.value=d.settings.phone;whatsapp.value=d.settings.whatsapp;inside.value=d.settings.deliveryInside;outside.value=d.settings.deliveryOutside;cod.checked=d.settings.cod;form.onsubmit=e=>{e.preventDefault();d.settings={shopName:shopName.value,phone:phone.value,whatsapp:whatsapp.value,deliveryInside:Number(inside.value),deliveryOutside:Number(outside.value),cod:cod.checked};MT.save(d);alert("সেটিংস সংরক্ষণ হয়েছে")};</script></body></html>
